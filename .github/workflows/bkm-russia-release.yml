name: BKM Russian hosting - ready-to-upload release
on:
  push:
    branches: [cloudflare/pages-v1]
    paths:
      - 'approved/**'
      - 'api/lead.php'
      - 'assets/**'
      - 'scripts/build-production.py'
      - 'index.html'
      - '*.html'
      - '.github/workflows/bkm-russia-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved legal pages
        run: |
          set -euo pipefail
          grep -q 'bkm-policy-status" content="approved"' approved/privacy.html
          grep -q 'bkm-consent-version" content="bkm-consent-uploaded-2026-11-06-v1"' approved/consent.html
      - name: Assemble a Beget/other Russian PHP hosting release
        run: |
          set -euo pipefail
          BKM_CRM_RELEASE=on python3 scripts/build-production.py
          test -s _production_release/index.html
          test -s _production_release/approved/consent.html || test -s _production_release/consent.html
          test -s _production_release/privacy.html
          test -s _production_release/api/lead.php
          grep -q 'formsEnabled: true' _production_release/assets/site-config.js
          grep -q 'bkm-lead-form' _production_release/index.html
          grep -q 'bkm-consent-uploaded-2026-11-06-v1' _production_release/consent.html
          test ! -e _production_release/.env
          test ! -e _production_release/config.php
      - name: Lint PHP receiver
        run: |
          if command -v php >/dev/null 2>&1; then
            php -l _production_release/api/lead.php
          else
            echo "No PHP binary available on runner; static release checks passed"
          fi
      - name: Upload build for Russian hosting, no credentials included
        uses: actions/upload-artifact@v4
        with:
          name: BKM-24bkm-ru-host-ready
          path: _production_release/
          retention-days: 14
          if-no-files-found: error
