name: Deploy BKM to Beget
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload approved website
        env:
          HOST: ${{ secrets.BEGET_HOST }}
          USER: ${{ secrets.BEGET_USER }}
        run: |
          set -eu
          test -n "$HOST" && test -n "$USER"
          rsync -az --exclude='.git/' --exclude='.github/' --exclude='wrangler.jsonc' --exclude='README.md' --exclude='*.md' --exclude='index.php' -e 'ssh -o StrictHostKeyChecking=yes -o BatchMode=yes' ./ "$USER@$HOST:/home/h/help24pw/help24pw.beget.tech/public_html/"
