name: BKM Web PHP Runtime Diagnostic - No CRM Leads
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bkm-web-php-diagnostic.yml']
permissions:
  contents: read
concurrency:
  group: bkm-beget-live
  cancel-in-progress: false
jobs:
  php-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      DEPLOY_HOST: ${{ secrets.BEGET_HOST }}
      DEPLOY_USER: ${{ secrets.BEGET_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 72d2a5c5f26b0af5c5216396822c16f473bf3f06
          persist-credentials: false
      - name: Configure existing Beget SSH
        env:
          DEPLOY_KEY: ${{ secrets.BEGET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
      - name: Inspect web PHP execution safely and remove temporary probes
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20"
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          ROOT="/home/h/help24pw/24bkm.com/public_html"
          PROBE="bkm-web-health-$GITHUB_RUN_ID"
          FILE="$ROOT/api/$PROBE.php"
          CHECK="$ROOT/api/$PROBE-check.php"
          mkdir -p local-probes
          cat > local-probes/health.php <<'PHP'
          <?php
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          echo json_encode(['web_php_version'=>PHP_VERSION,'php_sapi'=>PHP_SAPI,'curl'=>extension_loaded('curl'),'mbstring'=>extension_loaded('mbstring')]);
          PHP
          cleanup() {
            ssh $SSH_OPTS "$REMOTE" "rm -f '$FILE' '$CHECK'" || true
          }
          trap cleanup EXIT
          ssh $SSH_OPTS "$REMOTE" "test -d '$ROOT/api' && test ! -e '$FILE' && test ! -e '$CHECK'"
          scp $SSH_OPTS local-probes/health.php "$REMOTE:$FILE"
          scp $SSH_OPTS api/lead.php "$REMOTE:$CHECK"
          for test_name in web-php lead-get lead-disabled-post; do
            case "$test_name" in
              web-php)
                URL="https://24bkm.com/api/$PROBE.php"
                curl --max-time 20 -sS -D local-probes/head -o local-probes/body "$URL"
                ;;
              lead-get)
                URL="https://24bkm.com/api/$PROBE-check.php"
                curl --max-time 20 -sS -D local-probes/head -o local-probes/body "$URL"
                ;;
              lead-disabled-post)
                URL="https://24bkm.com/api/$PROBE-check.php"
                curl --max-time 20 -sS -D local-probes/head -o local-probes/body -X POST \
                  -H 'Origin: https://24bkm.com' -H 'Referer: https://24bkm.com/index.html' \
                  -H 'Content-Type: application/json' --data '{}' "$URL"
                ;;
            esac
            CHECK_NAME="$test_name" python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          h=Path('local-probes/head').read_text(errors='replace').splitlines()
          b=Path('local-probes/body').read_text(errors='replace')
          status=[x for x in h if x.startswith('HTTP/')][-1:]
          content_type=[x for x in h if x.lower().startswith('content-type:')][-1:]
          try:
              parsed=json.loads(b)
              if isinstance(parsed,dict):
                  result={k:parsed.get(k) for k in ('code','ok','web_php_version','php_sapi','curl','mbstring') if k in parsed}
              else: result={'json_type':type(parsed).__name__}
          except Exception:
              title=re.search(r'<title[^>]*>(.*?)</title>',b,re.I|re.S)
              result={'non_json':True,'length':len(b),'title':re.sub(r'\s+',' ',title.group(1)).strip()[:100] if title else None}
          print('BKM_WEB_DIAGNOSTIC',os.environ['CHECK_NAME'],status,content_type,result)
          PY
          done
          echo "NO CRM LEADS CREATED; probes removed on exit"
