name: Test Beget SSH connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH securely
        env:
          DEPLOY_KEY: ${{ secrets.BEGET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          echo "Checking whether the configured SSH host has a usable ED25519 key..."
          ssh-keygen -F "$BEGET_HOST" -f ~/.ssh/known_hosts > "$RUNNER_TEMP/bkm-host-matches" || { echo "::error::No matching host entry in BEGET_KNOWN_HOSTS"; exit 1; }
          awk '$2 ~ /^(ssh-ed25519|ecdsa-sha2-|ssh-rsa)/ {print "Configured key type: " $2}' "$RUNNER_TEMP/bkm-host-matches"
          awk '$2 == "ssh-ed25519" && $3 ~ /^AAAA/ {print $2 " " $3; exit}' "$RUNNER_TEMP/bkm-host-matches" > "$RUNNER_TEMP/bkm-host-ed25519.pub"
          if [ ! -s "$RUNNER_TEMP/bkm-host-ed25519.pub" ]; then
            echo "::error::BEGET_KNOWN_HOSTS has no valid ED25519 key for BEGET_HOST. Copy the complete 'hostname ssh-ed25519 AAAA...' line, not a fingerprint or SSH banner."
            exit 1
          fi
          fingerprint=$(ssh-keygen -lf "$RUNNER_TEMP/bkm-host-ed25519.pub" -E sha256 | awk '{print $2}')
          echo "Saved server key fingerprint: $fingerprint"
          expected="SHA256:4+NodSyDnT38XilJxBKCva9nOl+04LnsAMKZpr0mh48"
          if [ "$fingerprint" != "$expected" ]; then
            echo "::error::Stored server key fingerprint differs from the fingerprint previously observed for pudge.beget.ru. Recheck with Beget support before continuing."
            exit 1
          fi
          echo "Server key formatting and fingerprint check passed."
      - name: Verify connection and target directory (read only)
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -eu
          test -n "$BEGET_HOST" && test -n "$BEGET_USER"
          ssh -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$BEGET_USER@$BEGET_HOST" 'whoami; test -d /home/h/help24pw/help24pw.beget.tech/public_html && echo "BKM_TARGET_DIRECTORY_OK"'
