name: Test Beget SSH connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH securely
        env:
          DEPLOY_KEY: ${{ secrets.BEGET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$BEGET_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          host = os.environ["BEGET_HOST"].strip()
          expected = "SHA256:4+NodSyDnT38XilJxBKCva9nOl+04LnsAMKZpr0mh48"
          entries = Path.home().joinpath(".ssh/known_hosts").read_text().splitlines()
          found = False
          for entry in entries:
              line = entry.strip()
              if not line or line.startswith("#"):
                  continue
              fields = line.split()
              if len(fields) < 3 or host not in fields[0].split(","):
                  continue
              if fields[1] != "ssh-ed25519":
                  continue
              found = True
              try:
                  blob = base64.b64decode(fields[2], validate=True)
                  fingerprint = "SHA256:" + base64.b64encode(hashlib.sha256(blob).digest()).decode().rstrip("=")
              except (ValueError, base64.binascii.Error):
                  raise SystemExit("Invalid base64 in BEGET_KNOWN_HOSTS")
              print("Stored host key fingerprint:", fingerprint)
              if fingerprint != expected:
                  raise SystemExit("Stored fingerprint differs from previously observed Beget fingerprint. Verify the official fingerprint with Beget support.")
              print("Known-hosts entry is correctly formatted.")
              break
          if not found:
              raise SystemExit("No ED25519 entry for configured BEGET_HOST in BEGET_KNOWN_HOSTS.")
          PY
      - name: Verify connection and target directory (read only)
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -eu
          test -n "$BEGET_HOST" && test -n "$BEGET_USER"
          ssh -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$BEGET_USER@$BEGET_HOST" 'whoami; test -d /home/h/help24pw/help24pw.beget.tech/public_html && echo "BKM_TARGET_DIRECTORY_OK"'
