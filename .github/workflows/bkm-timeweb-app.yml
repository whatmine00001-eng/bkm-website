name: BKM Timeweb Cloud - PHP 8.2 App Platform readiness
on:
  push:
    branches: [timeweb/app-platform-v1]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'timeweb/**'
      - 'api/**'
      - 'scripts/build-production.py'
      - 'approved/**'
      - 'assets/**'
      - '*.html'
      - '.github/workflows/bkm-timeweb-app.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Timeweb public release with no secrets
        run: |
          set -euo pipefail
          BKM_CRM_RELEASE=on BKM_RUNTIME_TARGET=timeweb python3 scripts/build-production.py
          test -s _production_release/index.html
          test -s _production_release/api/lead.php
          test -s _production_release/api/form-config.php
          test -s _production_release/assets/form-setup.js
          grep -q 'name="name"' _production_release/index.html
          grep -q 'id="bkm-form-token"' _production_release/index.html
          grep -q 'type="submit" disabled' _production_release/index.html
          grep -q '/api/form-config.php' _production_release/assets/form-setup.js
          ! grep -q 'cf-turnstile' _production_release/index.html
          ! grep -q 'turnstile_token' _production_release/assets/lead-form.js
          grep -q 'leadEndpoint: "/api/lead.php"' _production_release/assets/site-config.js
          test ! -e _production_release/config.php
          test ! -e _production_release/.env
      - name: Build real PHP 8.2 Docker image
        run: |
          docker build --tag bkm-timeweb:test .
      - name: Test running Apache/PHP without real credentials
        run: |
          set -euo pipefail
          docker run -d --name bkm-test --publish 127.0.0.1:18080:80 \
            -e BKM_CRM_ENABLED=false -e BKM_ALLOWED_HOSTS=24bkm.com \
            bkm-timeweb:test
          trap 'docker rm -f bkm-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS -o /tmp/bkm-home http://127.0.0.1:18080/; then break; fi
            sleep 1
          done
          grep -q 'БКМ' /tmp/bkm-home
          curl -fsS http://127.0.0.1:18080/privacy.html | grep -q 'Политика'
          result="$(curl -sS -o /tmp/bkm-config -w '%{http_code}' \
            -H 'Host: 24bkm.com' http://127.0.0.1:18080/api/form-config.php)"
          test "$result" = "503"
          grep -q '"ready":false' /tmp/bkm-config
          # No authenticated request or CRM lead is sent by these tests.
          docker exec bkm-test php -l /var/www/html/api/lead.php
          docker exec bkm-test php -l /var/www/html/api/form-config.php
          echo 'BKM_TIMEWEB_PHP_DOCKER_READY'
