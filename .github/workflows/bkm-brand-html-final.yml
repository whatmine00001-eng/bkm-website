name: BKM Final Header and SEO - Static HTML Only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bkm-brand-html-final.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bkm-beget-live
  cancel-in-progress: false
jobs:
  finalize-static-html:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b61399aef28b8222f083466bab45ed51411b3944
          persist-credentials: false
      - name: Compile and test deterministic single-action HTML transformation
        run: |
          set -eu
          python3 -m py_compile scripts/finalize-brand-pages.py ops/release-brand-html.py
          python3 scripts/finalize-brand-pages.py . --self-test
      - name: Install browser checks before any hosting changes
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Use existing secured Beget connection
        env:
          SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
          SSH_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
          HOST: ${{ secrets.BEGET_HOST }}
          USER: ${{ secrets.BEGET_USER }}
        run: |
          set -eu
          test -n "$SSH_KEY" && test -n "$SSH_HOSTS" && test -n "$HOST" && test -n "$USER"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts >/dev/null
      - name: Verify candidate, back up HTML, publish and verify live or restore
        env:
          HOST: ${{ secrets.BEGET_HOST }}
          USER: ${{ secrets.BEGET_USER }}
        run: python3 ops/release-brand-html.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bkm-brand-html-${{ github.run_id }}
          path: brand-release-review/
          retention-days: 7
          if-no-files-found: warn
