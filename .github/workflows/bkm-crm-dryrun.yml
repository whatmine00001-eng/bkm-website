name: BKM CRM - Approved Documents & Form Dry Run (No Publishing)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bkm-crm-dryrun.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6c96a9fd563e0117a3610146239ef7ce772ceb5e
          persist-credentials: false
      - name: Verify PHP, JS and consent documents
        run: |
          set -eu
          python3 -m py_compile scripts/build-production.py scripts/finalize-brand-pages.py scripts/site_header.py scripts/financial_support.py
          php -l api/lead.php
          node --check assets/lead-form.js
          python3 scripts/test_crm_release.py
          python3 scripts/test_lead_safety.py
          test -s approved/privacy.html
          test -s approved/consent.html
          grep -q 'bkm-policy-status.*approved' approved/privacy.html
          grep -q 'bkm-consent-version' approved/consent.html
      - name: Build the proposed LIVE CRM candidate in CI only
        env:
          BKM_CRM_RELEASE: on
        run: |
          set -eu
          python3 scripts/build-production.py
          test -s _production_release/index.html
          test -s _production_release/privacy.html
          test -s _production_release/consent.html
          test -s _production_release/api/lead.php
          grep -q 'formsEnabled: true' _production_release/assets/site-config.js
          grep -q 'href="consent.html"' _production_release/index.html
          grep -q 'href="privacy.html"' _production_release/index.html
          grep -q 'Финансовое сопровождение' _production_release/index.html
          python3 scripts/finalize-brand-pages.py . --self-test
          python3 scripts/finalize-brand-pages.py _production_release
          python3 scripts/site_header.py
          python3 scripts/financial_support.py --self-test
          python3 scripts/financial_support.py _production_release
          python3 scripts/test_contacts.py
          echo "SAFE_CRM_CANDIDATE_PASS: build only. No server, DNS, CRM or personal data modified."
