name: BKM SEO and Public Headers - Read Only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.releases/bkm-seo-audit-20261027.txt']
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Observe public responses without modifying website or DNS
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, urllib.request, urllib.error
          from html.parser import HTMLParser
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET
          class Head(HTMLParser):
              def __init__(self):
                  super().__init__(); self.meta={}; self.canonical=[]; self.scripts=[]; self.images=[]; self.title=''; self.in_title=False; self.ld=False; self.jsonld=[]; self.buf=''
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='title': self.in_title=True
                  if tag=='meta': self.meta[a.get('name',a.get('property',''))]=a.get('content','')
                  if tag=='link' and a.get('rel')=='canonical': self.canonical.append(a.get('href',''))
                  if tag=='script':
                      self.scripts.append(a.get('src','inline')); self.ld=a.get('type')=='application/ld+json'; self.buf=''
                  if tag=='img': self.images.append(a.get('src',''))
              def handle_data(self,data):
                  if self.in_title: self.title+=data
                  if self.ld: self.buf+=data
              def handle_endtag(self,tag):
                  if tag=='title': self.in_title=False
                  if tag=='script' and self.ld:
                      try: self.jsonld.append(json.loads(self.buf))
                      except ValueError: self.jsonld.append({'invalid':True})
                      self.ld=False
          class LimitedRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if urlparse(newurl).hostname not in ('24bkm.com','www.24bkm.com'):
                      raise ValueError('Redirect to unexpected host not followed')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          wanted=['content-type','location','strict-transport-security','content-security-policy','content-security-policy-report-only','x-frame-options','x-content-type-options','referrer-policy','permissions-policy','x-robots-tag','server','x-powered-by']
          def run(url):
              out={'url':url}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'BKM-owner-readonly-audit/1.0'})
                  try:
                      with urllib.request.build_opener(NoRedirect()).open(req,timeout=15) as r: out['initial_status']=r.status
                  except urllib.error.HTTPError as e:
                      out['initial_status']=e.code
                      if e.code in (301,302,303,307,308): out['location']=e.headers.get('Location')
                  with urllib.request.build_opener(LimitedRedirect()).open(req,timeout=15) as r:
                      body=r.read(600000).decode('utf-8',errors='replace'); out.update(status=r.status,final_url=r.url)
                      out['headers']={h:r.headers.get(h) for h in wanted if r.headers.get(h)}
                      if 'text/html' in r.headers.get('Content-Type',''):
                          p=Head(); p.feed(body); out.update(title=p.title,meta=p.meta,canonical=p.canonical,jsonld=p.jsonld)
                          out['external_assets']=sorted(set(urlparse(a).hostname for a in p.scripts+p.images if a.startswith('https://')))
                      elif url.endswith('robots.txt'): out['robots']=body[:4000]
                      elif url.endswith('sitemap.xml'):
                          root=ET.fromstring(body); urls=[n.text for n in root.findall('.//{*}loc')]; out['sitemap_urls']=urls
              except urllib.error.HTTPError as e: out.update(status=e.code,error='HTTP error')
              except Exception as e: out['error']=str(e)[:250]
              return out
          urls=['https://24bkm.com/','http://24bkm.com/','https://www.24bkm.com/','https://24bkm.com/index.html','https://24bkm.com/robots.txt','https://24bkm.com/sitemap.xml','https://24bkm.com/bkm-audit-missing-20261027.html']
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              for result in pool.map(run,urls): print(json.dumps(result,ensure_ascii=False))
          print('READ_ONLY_COMPLETE: ordinary public GETs only; no private paths, CRM calls, credentials, writes or deployment. This single runner is not a worldwide availability test or penetration test.')
          PY
