name: BKM Preview - Select Design Branch

# The default/main branch must never upload raw sources to a public preview.
# Use the workflow version on design/bkm-modern-v1 when a manual test
# deployment is needed, after its CI checks have passed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-main-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Preview deployment disabled on main
        run: |
          echo "SAFE: No Beget upload from the main branch."
          echo "To publish an isolated preview, select branch design/bkm-modern-v1 in Run workflow."
          echo "The design-branch workflow validates first and only publishes after an explicit manual action."
          echo "The live 24bkm.com site, DNS and Bitrix24 are not modified."
