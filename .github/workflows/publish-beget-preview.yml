name: Publish BKM preview to Beget

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bkm-beget-preview
  cancel-in-progress: false

jobs:
  publish-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed website source
        uses: actions/checkout@v4
        with:
          ref: design/bkm-modern-v1
          persist-credentials: false

      - name: Check website files
        run: |
          set -eu
          test -s index.html
          test -s services.html
          grep -qi '<html' index.html
          grep -qi '<html' services.html

      - name: Configure SSH for Beget
        env:
          DEPLOY_KEY: ${{ secrets.BEGET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          test -n "$BEGET_HOST" && test -n "$BEGET_USER"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -F "$BEGET_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Publish isolated preview (do not touch live site)
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -eu
          TARGET="/home/h/help24pw/help24pw.beget.tech/public_html/bkm-preview"
          SSH_OPTS="-o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20"
          ssh $SSH_OPTS "$BEGET_USER@$BEGET_HOST" "mkdir -p '$TARGET'"
          rsync -av --chmod=F644 -e "ssh $SSH_OPTS" index.html services.html "$BEGET_USER@$BEGET_HOST:$TARGET/"
          echo "Published preview: https://help24pw.beget.tech/bkm-preview/index.html"
