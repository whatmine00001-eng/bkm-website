name: BKM Preview - Validate Automatically, Publish Manually

on:
  push:
    branches:
      - design/bkm-modern-v1
    paths:
      - '*.html'
      - 'assets/**'
      - 'api/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bkm-beget-preview
  cancel-in-progress: false

jobs:
  preview-checks:
    if: github.ref == 'refs/heads/design/bkm-modern-v1'
    runs-on: ubuntu-latest
    env:
      BKM_CRM_RELEASE: off

    steps:
      - name: Checkout exact design revision being checked
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate all Python scripts, PHP, JavaScript and local links
        run: |
          set -eu
          python3 -m compileall -q scripts
          python3 scripts/test_crm_release.py
          for file in index.html services.html customs-clearance.html international-freight.html freight-forwarding.html warehousing-logistics.html consolidated-cargo.html news.html; do
            test -s "$file"
            grep -qi '<html' "$file"
          done
          for file in news-*.html; do
            test -s "$file"
            grep -qi '<html' "$file"
          done
          for asset in assets/bkm-header.svg assets/bkm-symbol.svg assets/news.css assets/home-redesign.css assets/home-brand-final.css assets/interior-redesign.css assets/home.js assets/site-config.js assets/analytics.js assets/lead-form.js; do
            test -s "$asset"
          done
          for script in assets/*.js; do node --check "$script"; done
          php -l api/lead.php
          php -l scripts/check-crm-config.php
          python3 - <<'PY'
          from pathlib import Path
          import re
          broken = []
          for page in Path(".").glob("*.html"):
              source = page.read_text(encoding="utf-8")
              if not re.search(r'content=["\']noindex\s*,\s*nofollow["\']', source, re.I):
                  broken.append(f"{page}: preview must remain noindex,nofollow")
              for value in re.findall(r'(?:href|src)=["\']([^"\']+)["\']', source):
                  target = value.split("#")[0].split("?")[0]
                  if not target or ":" in target or target.startswith(("#", "//", "/")):
                      continue
                  if not (page.parent / target).is_file():
                      broken.append(f"{page}: missing {target}")
          if broken:
              raise SystemExit("\n".join(broken))
          print("Preview HTML, noindex and local links validated.")
          PY

      - name: Build production candidate LOCALLY in SAFE mode only
        run: |
          set -eu
          python3 scripts/build-production.py
          python3 scripts/test_contacts.py
          test -s _production_release/index.html
          test -s _production_release/sitemap.xml
          test -s _production_release/robots.txt
          test ! -e _production_release/api/lead.php
          test ! -e _production_release/privacy.html
          grep -q 'formsEnabled: false' _production_release/assets/site-config.js
          ! grep -i -l 'noindex,nofollow' _production_release/*.html
          ! grep -q 'id="bkm-lead-form"' _production_release/index.html
          test -s _production_release/assets/bkm-header.svg
          echo "SAFE build checks passed. No website files have been uploaded."

      - name: Build inert noindex preview without collecting personal data
        run: |
          set -eu
          python3 scripts/build-preview.py
          test -s _preview_release/index.html
          test -s _preview_release/robots.txt
          test -s _preview_release/assets/bkm-header.svg
          test ! -e _preview_release/api/lead.php
          test ! -e _preview_release/privacy.html
          test ! -e _preview_release/assets/lead-form.js
          ! grep -q 'id="bkm-lead-form"' _preview_release/index.html
          ! grep -qi '<form' _preview_release/index.html
          grep -q 'id="bkm-preview-contact"' _preview_release/index.html
          grep -q 'formsEnabled: false' _preview_release/assets/site-config.js
          grep -iq 'noindex,nofollow' _preview_release/index.html
          grep -q 'Disallow: /' _preview_release/robots.txt
          echo "Preview is non-collecting; upload is restricted to explicit manual workflow."

      - name: Configure Beget SSH (ONLY on explicit manual preview)
        if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_KEY: ${{ secrets.BEGET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BEGET_KNOWN_HOSTS }}
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          test -n "$BEGET_HOST" && test -n "$BEGET_USER"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -F "$BEGET_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Publish ISOLATED noindex preview, without PHP CRM or draft policy
        if: github.event_name == 'workflow_dispatch'
        env:
          BEGET_HOST: ${{ secrets.BEGET_HOST }}
          BEGET_USER: ${{ secrets.BEGET_USER }}
        run: |
          set -eu
          TARGET="/home/h/help24pw/test.24bkm.com/public_html/bkm-preview"
          test "$TARGET" = "/home/h/help24pw/test.24bkm.com/public_html/bkm-preview"
          SSH_OPTS="-o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20"
          ssh $SSH_OPTS "$BEGET_USER@$BEGET_HOST" "mkdir -p '$TARGET' && rm -f '$TARGET/privacy.html' '$TARGET/api/lead.php'"
          rsync -av --chmod=F644,D755 -e "ssh $SSH_OPTS" _preview_release/ "$BEGET_USER@$BEGET_HOST:$TARGET/"
          ssh $SSH_OPTS "$BEGET_USER@$BEGET_HOST" "test -s '$TARGET/index.html' && grep -qi 'noindex,nofollow' '$TARGET/index.html' && test ! -e '$TARGET/privacy.html' && test ! -e '$TARGET/api/lead.php'"
          echo "Only the isolated Beget preview was updated. Live domain, DNS and Bitrix24 untouched."
          echo "Preview: http://test.24bkm.com/bkm-preview/index.html"
